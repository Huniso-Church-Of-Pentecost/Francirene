name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'android-native/**'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK platform + build-tools
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Restore release keystore (if configured)
        working-directory: android-native
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > app/release.keystore
          cat > keystore.properties << EOF
          storeFile=release.keystore
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
          build-root-directory: android-native

      - name: Build debug APK
        working-directory: android-native
        env:
          BACKEND_URL: ${{ vars.APP_BACKEND_URL || 'https://REPLACE-WITH-YOUR-BACKEND-URL.onrender.com' }}
        run: gradle assembleDebug -PBASE_URL="$BACKEND_URL" --no-daemon

      - name: Build release APK
        working-directory: android-native
        env:
          BACKEND_URL: ${{ vars.APP_BACKEND_URL || 'https://REPLACE-WITH-YOUR-BACKEND-URL.onrender.com' }}
        run: gradle assembleRelease -PBASE_URL="$BACKEND_URL" --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: francirene-debug-apk
          path: android-native/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: francirene-release-apk
          path: android-native/app/build/outputs/apk/release/app-release.apk
