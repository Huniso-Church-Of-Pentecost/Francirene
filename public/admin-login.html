<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Francirene Educational Consult</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" href="assets/badge.png" type="image">
    <link rel="stylesheet" href="css/auth.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="container">
            <div class="nav-content">
                <div class="logo">
                    <i class="fas fa-book"></i>
                    <span>Francirene Educational Consult</span>
                </div>
                <ul class="nav-links">
                    <li><a href="/">Home</a></li>
                </ul>
                <div class="nav-buttons">
                    <button class="nav-btn theme-toggle" id="themeToggle" title="Toggle dark mode">
                        <i class="fas fa-moon"></i>
                    </button>
                    <a href="/student-login" class="nav-btn"><i class="fas fa-user-graduate"></i></a>
                </div>
                <div class="hamburger">
                    <i class="fas fa-bars"></i>
                </div>
            </div>
        </div>
    </nav>

    <section class="login-section">
        <div class="login-container">
            <div class="login-box">
                <div class="login-header">
                    <i class="fas fa-user-shield"></i>
                    <h2>Admin Portal</h2>
                </div>
                <form id="adminLoginForm" class="login-form">
                    <div class="form-group">
                        <label for="username">Username</label>
                        <input type="text" id="username" placeholder="Enter username" required>
                    </div>
                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" placeholder="Enter password" required>
                    </div>
                    <button type="submit" class="btn btn-large btn-primary">Login</button>
                </form>
                <div id="loginMessage" class="message"></div>
            </div>
        </div>
    </section>

    <footer class="footer">
        <div class="container">
            <div class="footer-bottom">
                <p>&copy; 2024 Francirene Educational Consult. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <script src="js/theme.js"></script>
    <script src="js/admin-login.js"></script>
</body>
</html>
